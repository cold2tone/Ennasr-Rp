<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Log in — Ennasr RP staff</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="/"><img src="skyline.png" alt="">Ennasr RP</a>
    <a class="back" href="/">Back to site</a>
  </div>
</header>

<main>
  <div class="card">
    <p class="eyebrow">Staff portal</p>
    <h1>Log in</h1>
    <p class="lead">Log in to submit or update your weekly availability.</p>

    <form id="f" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" maxlength="30" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>

      <button class="btn" type="submit" id="go">Log in</button>
      <p class="msg err" id="err" role="alert"></p>
    </form>

    <p class="switch">New staff? <a href="/signup">Create an account</a></p>
  </div>
</main>

<script>
const $=id=>document.getElementById(id);
$("f").addEventListener("submit", async e=>{
  e.preventDefault();
  $("err").textContent="";
  const username=$("username").value.trim().toLowerCase();
  const password=$("password").value;
  if(!username||!password){$("err").textContent="Enter your username and password.";return;}

  $("go").disabled=true; $("go").textContent="Logging in...";
  try{
    const r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({username,password})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||"Something went wrong.");
    location.href="/staff";
  }catch(err){
    $("err").textContent=err.message;
    $("go").disabled=false; $("go").textContent="Log in";
  }
});
</script>
</body>
</html>
