<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>My availability — Ennasr RP staff</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d1411;--ink-2:#141d19;--ink-3:#1c2822;--chalk:#f2efe8;--stone:#8a9189;--siren:#e3242b;--ok:#2f9e6b;--line:rgba(242,239,232,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--chalk);font-family:"Instrument Sans",system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--siren);outline-offset:3px}
.wrap{width:min(1000px,94vw);margin-inline:auto}
header{padding:22px 0;border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-family:Fraunces,serif;font-weight:600;font-size:19px}
.brand img{height:24px}
.who{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--stone)}
.who b{color:var(--chalk)}
.who a{color:var(--stone);text-decoration:none;border-bottom:1px solid var(--line)}
.who a:hover{color:var(--chalk);border-color:var(--chalk)}

main{padding:56px 0 96px;display:none}
main.ready{display:block}
h1{font-family:Fraunces,serif;font-weight:600;font-size:clamp(30px,4vw,44px);line-height:1.1;margin-bottom:12px}
.lead{color:var(--stone);max-width:56ch;margin-bottom:36px}

label.field{display:block;font-weight:600;margin-bottom:8px}
textarea{width:100%;background:var(--ink-2);color:var(--chalk);border:1px solid var(--line);border-radius:8px;padding:13px 14px;font:inherit;resize:vertical;min-height:84px}
textarea:focus{border-color:rgba(242,239,232,.5);outline:none}
.row.wide{max-width:640px;margin-top:28px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
.toolbar span{color:var(--stone);font-size:14px;margin-right:4px}
.chip{background:transparent;border:1px solid var(--line);color:var(--chalk);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer;transition:background .15s,border-color .15s}
.chip:hover{background:rgba(242,239,232,.08);border-color:rgba(242,239,232,.4)}

.grid-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--ink-2);padding:6px}
table.grid{border-collapse:separate;border-spacing:3px;width:100%;min-width:640px;user-select:none;-webkit-user-select:none;touch-action:none}
.grid th{font-weight:500;font-size:13px;color:var(--stone);padding:6px 4px;text-align:center}
.grid th.day{text-align:left;padding-right:10px;color:var(--chalk);font-weight:600;font-size:14px;width:56px;cursor:pointer}
.grid th.day:hover{text-decoration:underline}
.grid td{padding:0}
.cell{height:34px;border-radius:5px;background:var(--ink-3);cursor:pointer;border:1px solid transparent;transition:background .08s}
.cell.on{background:var(--ok);border-color:rgba(255,255,255,.18)}
.cell:hover{border-color:rgba(242,239,232,.4)}
.legend{display:flex;gap:18px;margin:12px 0 0;font-size:14px;color:var(--stone);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.legend .f{background:var(--ok)}
.legend .b{background:var(--ink-3);border:1px solid var(--line)}

.submit-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 28px;border-radius:999px;border:0;cursor:pointer;background:var(--siren);color:#fff;font:inherit;font-weight:600;font-size:16px;transition:background .2s,transform .15s}
.btn:hover{background:#c91d24;transform:translateY(-1px)}
.btn[disabled]{opacity:.6;cursor:wait;transform:none}
.msg{font-size:15px}
.msg.ok{color:#6fd3a3}
.msg.err{color:#ff8b8f}
@media (max-width:640px){main{padding-top:36px}}
@media (prefers-reduced-motion:reduce){.btn,.chip,.cell{transition:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="/"><img src="skyline.png" alt="">Ennasr RP</a>
    <div class="who" id="who"></div>
  </div>
</header>

<main id="main">
  <div class="wrap">
    <h1>Set your availability</h1>
    <p class="lead" id="lead">Tap the hours you're free to work each week. Green means free. Submit again any time your schedule changes, it replaces your last one.</p>

    <form id="f" novalidate>
      <div class="toolbar">
        <span>Quick fill:</span>
        <button type="button" class="chip" data-fill="weekdays-eve">Weekdays 17:00 to 23:00</button>
        <button type="button" class="chip" data-fill="weekend">All weekend</button>
        <button type="button" class="chip" data-fill="all">Everything</button>
        <button type="button" class="chip" data-fill="none">Clear</button>
      </div>

      <div class="grid-scroll">
        <table class="grid" id="grid" aria-label="Weekly availability. Each cell is one hour."></table>
      </div>
      <div class="legend">
        <span><i class="f"></i>Free</span>
        <span><i class="b"></i>Busy</span>
        <span>Tip: drag across cells, or tap a day name to toggle the whole day.</span>
      </div>

      <div class="row wide">
        <label class="field" for="note">Note (optional)</label>
        <textarea id="note" maxlength="300" placeholder="Exams next week, can only do Friday after 20:00"></textarea>
      </div>

      <div class="submit-row">
        <button class="btn" id="go" type="submit">Send availability</button>
        <span class="msg" id="msg" role="status" aria-live="polite"></span>
      </div>
    </form>
  </div>
</main>

<script>
const DAYS = [["mon","Mon"],["tue","Tue"],["wed","Wed"],["thu","Thu"],["fri","Fri"],["sat","Sat"],["sun","Sun"]];
const HOURS = Array.from({length:24},(_,i)=>i);
const state = Object.fromEntries(DAYS.map(([k])=>[k,new Set()]));

async function boot(){
  const r = await fetch("/api/me");
  const { user } = await r.json();
  if(!user){ location.href="/login"; return; }
  document.getElementById("who").innerHTML = `Logged in as <b>${escapeHtml(user.displayName)}</b> <a href="#" id="out">Log out</a>`;
  document.getElementById("out").addEventListener("click", async e=>{
    e.preventDefault();
    await fetch("/api/logout",{method:"POST"});
    location.href="/login";
  });
  document.getElementById("main").classList.add("ready");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

const grid = document.getElementById("grid");
let html = "<thead><tr><th></th>" + HOURS.map(h=>`<th>${h}</th>`).join("") + "</tr></thead><tbody>";
for (const [k,label] of DAYS){
  html += `<tr><th class="day" scope="row" data-day="${k}" title="Toggle whole day">${label}</th>`;
  for (const h of HOURS) html += `<td><div class="cell" data-d="${k}" data-h="${h}" role="checkbox" aria-checked="false" aria-label="${label} ${h}:00" tabindex="-1"></div></td>`;
  html += "</tr>";
}
grid.innerHTML = html + "</tbody>";

function paint(cell,on){
  const d=cell.dataset.d,h=+cell.dataset.h;
  on ? state[d].add(h) : state[d].delete(h);
  cell.classList.toggle("on",on);
  cell.setAttribute("aria-checked",on);
}
function cellAt(x,y){
  const el=document.elementFromPoint(x,y);
  return el && el.classList && el.classList.contains("cell") ? el : null;
}

let dragging=false, dragValue=true;
grid.addEventListener("pointerdown",e=>{
  const c=e.target.closest(".cell"); if(!c) return;
  e.preventDefault();
  dragging=true; dragValue=!c.classList.contains("on"); paint(c,dragValue);
});
window.addEventListener("pointermove",e=>{
  if(!dragging) return;
  const c=cellAt(e.clientX,e.clientY); if(c) paint(c,dragValue);
});
window.addEventListener("pointerup",()=>dragging=false);
window.addEventListener("pointercancel",()=>dragging=false);

grid.addEventListener("click",e=>{
  const th=e.target.closest("th.day"); if(!th) return;
  const d=th.dataset.day;
  const cells=[...grid.querySelectorAll(`.cell[data-d="${d}"]`)];
  const allOn=cells.every(c=>c.classList.contains("on"));
  cells.forEach(c=>paint(c,!allOn));
});

document.querySelectorAll("[data-fill]").forEach(b=>b.addEventListener("click",()=>{
  const mode=b.dataset.fill;
  grid.querySelectorAll(".cell").forEach(c=>{
    const d=c.dataset.d,h=+c.dataset.h;
    let on=false;
    if(mode==="all") on=true;
    else if(mode==="weekend") on=(d==="sat"||d==="sun");
    else if(mode==="weekdays-eve") on=["mon","tue","wed","thu","fri"].includes(d)&&h>=17&&h<=22;
    if(mode==="none"){paint(c,false);return;}
    if(on) paint(c,true);
  });
}));

const msg=document.getElementById("msg"), go=document.getElementById("go");
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  msg.className="msg"; msg.textContent="";
  const total=Object.values(state).reduce((n,s)=>n+s.size,0);
  if(total===0 && !confirm("You marked no free hours. Send anyway?")) return;

  go.disabled=true; go.textContent="Sending...";
  try{
    const availability=Object.fromEntries(DAYS.map(([k])=>[k,[...state[k]].sort((a,b)=>a-b)]));
    const r=await fetch("/api/submit",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({availability,note:document.getElementById("note").value})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||"Something went wrong");
    msg.className="msg ok"; msg.textContent="Sent. Thanks, you're all set.";
  }catch(err){
    msg.className="msg err"; msg.textContent=err.message+". Try again.";
  }finally{
    go.disabled=false; go.textContent="Send availability";
  }
});

boot();
</script>
</body>
</html>
