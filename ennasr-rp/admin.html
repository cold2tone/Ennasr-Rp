<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Availability — Ennasr RP admin</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d1411;--ink-2:#141d19;--ink-3:#1c2822;--chalk:#f2efe8;--stone:#8a9189;--siren:#e3242b;--ok:#2f9e6b;--line:rgba(242,239,232,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--chalk);font-family:"Instrument Sans",system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--siren);outline-offset:3px}
.wrap{width:min(1180px,94vw);margin-inline:auto}
header{padding:22px 0;border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;font-family:Fraunces,serif;font-weight:600;font-size:19px}
.brand img{height:24px}
main{padding:44px 0 96px}
h1{font-family:Fraunces,serif;font-weight:600;font-size:clamp(28px,4vw,42px);line-height:1.1;margin-bottom:8px}
.lead{color:var(--stone);margin-bottom:28px}
h2{font-family:Fraunces,serif;font-weight:600;font-size:24px;margin:44px 0 14px}

/* login */
#login{max-width:380px;margin:12vh auto 0}
#login h1{font-size:32px}
input[type=password]{
  width:100%;background:var(--ink-2);color:var(--chalk);border:1px solid var(--line);
  border-radius:8px;padding:13px 14px;font:inherit;margin:16px 0 14px;
}
input[type=password]:focus{border-color:rgba(242,239,232,.5);outline:none}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:13px 26px;border-radius:999px;border:0;cursor:pointer;
  background:var(--siren);color:#fff;font:inherit;font-weight:600;
  transition:background .2s;
}
.btn:hover{background:#c91d24}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--chalk);padding:9px 18px;font-size:14px;font-weight:500}
.btn.ghost:hover{background:rgba(242,239,232,.08)}
.err{color:#ff8b8f;font-size:15px;margin-top:12px;min-height:1.5em}
#app{display:none}

/* free now */
.now{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.now select{
  background:var(--ink-2);color:var(--chalk);border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;font:inherit;font-size:15px;
}
.people{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;min-height:40px}
.pill{background:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:15px}
.pill.free{background:rgba(47,158,107,.18);border-color:rgba(47,158,107,.55)}
.empty{color:var(--stone)}
.count{color:var(--stone);font-size:15px}

/* overview: coverage heatmap */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--ink-2);padding:8px}
table.hm{border-collapse:separate;border-spacing:3px;width:100%;min-width:700px}
.hm th{font-weight:500;font-size:12px;color:var(--stone);padding:4px 2px;text-align:center}
.hm th.day{text-align:left;color:var(--chalk);font-weight:600;font-size:14px;width:52px}
.hm td{height:34px;border-radius:5px;text-align:center;font-size:12px;font-weight:600;background:var(--ink-3);color:rgba(242,239,232,.85)}
.hm td[data-n="0"]{color:transparent}
.hm td.hit{cursor:pointer}
.hm td.hit:hover{outline:2px solid var(--chalk)}
.hint{color:var(--stone);font-size:14px;margin-top:10px}

/* per person */
.person{border:1px solid var(--line);border-radius:10px;background:var(--ink-2);padding:18px 18px 16px;margin-bottom:14px}
.person-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.person h3{font-family:Fraunces,serif;font-weight:600;font-size:21px}
.meta{color:var(--stone);font-size:13px}
.note{margin:0 0 12px;padding:10px 12px;border-left:3px solid var(--siren);background:var(--ink-3);border-radius:0 6px 6px 0;font-size:15px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.d{background:var(--ink-3);border-radius:8px;padding:10px 10px 11px;min-height:64px}
.d b{display:block;font-size:13px;margin-bottom:4px}
.d span{font-size:13px;color:rgba(242,239,232,.85);line-height:1.4;display:block}
.d.busy span{color:var(--stone)}
.d.has{background:rgba(47,158,107,.16);border:1px solid rgba(47,158,107,.4)}
.actions{margin-top:12px;display:flex;justify-content:flex-end}
.btn.danger{color:#ff8b8f;border-color:rgba(255,139,143,.35)}
@media (max-width:820px){.days{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="/"><img src="skyline.png" alt="">Ennasr RP</a>
    <button class="btn ghost" id="out" style="display:none">Log out</button>
  </div>
</header>

<div class="wrap" id="login">
  <h1>Admin login</h1>
  <p class="lead" style="margin:6px 0 0">Enter the password to see staff availability.</p>
  <form id="lf">
    <label for="pw" style="position:absolute;left:-9999px">Password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
    <button class="btn" type="submit">Log in</button>
    <div class="err" id="lerr" role="alert"></div>
  </form>
</div>

<main id="app">
  <div class="wrap">
    <h1>Staff availability</h1>
    <p class="lead" id="sum"></p>
    <p class="hint" id="live" style="margin-top:-14px"></p>

    <h2 style="margin-top:0">Who's free</h2>
    <div class="now">
      <select id="selDay" aria-label="Day"></select>
      <select id="selHour" aria-label="Hour"></select>
      <button class="btn ghost" id="nowBtn">Right now</button>
      <span class="count" id="cnt"></span>
    </div>
    <div class="people" id="people"></div>

    <h2>Coverage this week</h2>
    <p class="hint" style="margin:-6px 0 12px">Number in each cell = how many staff are free that hour. Click a cell to see who.</p>
    <div class="scroll"><table class="hm" id="hm"></table></div>

    <h2>Everyone</h2>
    <div id="list"></div>
  </div>
</main>

<script>
const DAYS=[["mon","Mon","Monday"],["tue","Tue","Tuesday"],["wed","Wed","Wednesday"],["thu","Thu","Thursday"],["fri","Fri","Friday"],["sat","Sat","Saturday"],["sun","Sun","Sunday"]];
const $=id=>document.getElementById(id);
let PW=sessionStorage.getItem("ennasr_admin")||"";
let STAFF=[];

const pad=h=>String(h).padStart(2,"0")+":00";
function ranges(hrs){
  if(!hrs.length) return "Busy";
  const out=[];let s=hrs[0],p=hrs[0];
  for(let i=1;i<=hrs.length;i++){
    if(hrs[i]!==p+1){out.push(s===p?`${pad(s)}`:`${pad(s)} to ${pad(p+1===24?0:p+1)}`);s=hrs[i];}
    p=hrs[i];
  }
  return out.join(", ");
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function ago(iso){
  const m=Math.round((Date.now()-new Date(iso))/60000);
  if(m<1) return "just now"; if(m<60) return m+" min ago";
  const h=Math.round(m/60); if(h<24) return h+" h ago";
  return Math.round(h/24)+" d ago";
}

async function load(){
  const r=await fetch("/api/availability",{headers:{"x-admin-password":PW}});
  if(r.status===401) throw new Error("Wrong password");
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||"Could not load data");
  STAFF=j.staff;
}

function show(){
  $("login").style.display="none";
  $("app").style.display="block";
  $("out").style.display="inline-flex";
  render();
}

function freeAt(day,h){return STAFF.filter(s=>(s.availability[day]||[]).includes(h));}

function render(){
  $("sum").textContent=STAFF.length?`${STAFF.length} staff have submitted availability.`:"Nobody has submitted yet. Share the /staff link with your team.";

  // selects
  $("selDay").innerHTML=DAYS.map(([k,,full])=>`<option value="${k}">${full}</option>`).join("");
  $("selHour").innerHTML=Array.from({length:24},(_,h)=>`<option value="${h}">${pad(h)}</option>`).join("");
  setNow();

  // heatmap
  let max=Math.max(1,...DAYS.flatMap(([k])=>Array.from({length:24},(_,h)=>freeAt(k,h).length)));
  let t="<thead><tr><th></th>"+Array.from({length:24},(_,h)=>`<th>${h}</th>`).join("")+"</tr></thead><tbody>";
  for(const [k,label] of DAYS){
    t+=`<tr><th class="day" scope="row">${label}</th>`;
    for(let h=0;h<24;h++){
      const n=freeAt(k,h).length;
      const a=n? (.22+.68*(n/max)) : 0;
      t+=`<td data-n="${n}" data-d="${k}" data-h="${h}" class="${n?"hit":""}" style="${n?`background:rgba(47,158,107,${a.toFixed(2)})`:""}">${n||""}</td>`;
    }
    t+="</tr>";
  }
  $("hm").innerHTML=t+"</tbody>";

  // people list
  $("list").innerHTML=STAFF.length?STAFF.map(s=>`
    <div class="person">
      <div class="person-head"><h3>${esc(s.name)}</h3><span class="meta">Updated ${ago(s.updatedAt)}</span></div>
      ${s.note?`<p class="note">${esc(s.note)}</p>`:""}
      <div class="days">${DAYS.map(([k,l])=>{
        const h=s.availability[k]||[];
        return `<div class="d ${h.length?"has":"busy"}"><b>${l}</b><span>${h.length?esc(ranges(h)):"Busy"}</span></div>`;
      }).join("")}</div>
      <div class="actions"><button class="btn ghost danger" data-rm="${esc(s.username)}" data-label="${esc(s.name)}">Remove</button></div>
    </div>`).join(""):`<p class="empty">Nothing here yet.</p>`;

  refreshPeople();
}

function refreshPeople(){
  const d=$("selDay").value,h=+$("selHour").value;
  const free=freeAt(d,h), freeNames=new Set(free.map(s=>s.name));
  $("cnt").textContent=`${free.length} of ${STAFF.length} free`;
  $("people").innerHTML=STAFF.length?STAFF.map(s=>`<span class="pill ${freeNames.has(s.name)?"free":""}">${esc(s.name)}</span>`).join(""):`<span class="empty">No staff yet.</span>`;
}

function setNow(){
  const n=new Date();
  const map=["sun","mon","tue","wed","thu","fri","sat"];
  $("selDay").value=map[n.getDay()];
  $("selHour").value=n.getHours();
}

$("selDay").addEventListener("change",refreshPeople);
$("selHour").addEventListener("change",refreshPeople);
$("nowBtn").addEventListener("click",()=>{setNow();refreshPeople();});
$("hm").addEventListener("click",e=>{
  const td=e.target.closest("td.hit"); if(!td) return;
  $("selDay").value=td.dataset.d; $("selHour").value=td.dataset.h; refreshPeople();
  $("people").scrollIntoView({behavior:"smooth",block:"center"});
});
$("list").addEventListener("click",async e=>{
  const b=e.target.closest("[data-rm]"); if(!b) return;
  const username=b.dataset.rm, label=b.dataset.label||username;
  if(!confirm(`Remove ${label}'s account and availability? This can't be undone.`)) return;
  const r=await fetch("/api/remove",{method:"POST",headers:{"content-type":"application/json","x-admin-password":PW},body:JSON.stringify({username})});
  if(r.ok){await load();render();}
});

$("lf").addEventListener("submit",async e=>{
  e.preventDefault();
  $("lerr").textContent="";
  PW=$("pw").value;
  try{await load();sessionStorage.setItem("ennasr_admin",PW);show();startPolling();$("live").textContent="Updated "+new Date().toLocaleTimeString();}
  catch(err){$("lerr").textContent=err.message+".";}
});
$("out").addEventListener("click",()=>{stopPolling();sessionStorage.removeItem("ennasr_admin");location.reload();});

// auto-refresh every 30s while logged in, paused when the tab isn't visible
let pollTimer=null;
function startPolling(){
  stopPolling();
  pollTimer=setInterval(async()=>{
    if(document.hidden) return;
    try{
      await load();
      render();
      $("live").textContent="Updated "+new Date().toLocaleTimeString();
    }catch(err){
      // password changed or network hiccup — stop trying and ask to log in again
      stopPolling();
      sessionStorage.removeItem("ennasr_admin");
      location.reload();
    }
  },30000);
}
function stopPolling(){ if(pollTimer) clearInterval(pollTimer); pollTimer=null; }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && PW) load().then(render).catch(()=>{}); });

// auto-login if this tab already has the password
if(PW){
  load().then(()=>{show();startPolling();$("live").textContent="Updated "+new Date().toLocaleTimeString();})
        .catch(()=>sessionStorage.removeItem("ennasr_admin"));
}
</script>
</body>
</html>
